<svg fill="none" viewBox="0 0 800 200" width="100%" height="200" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes amberPulse {
          0%, 100% { filter: drop-shadow(0 0 10px rgba(245, 158, 11, 0.6)); }
          50% { filter: drop-shadow(0 0 3px rgba(245, 158, 11, 0.2)); }
        }
        @keyframes scanline {
          0% { transform: translateY(-100%); }
          100% { transform: translateY(1000%); }
        }
        @keyframes blink {
          0%, 49% { opacity: 1; }
          50%, 100% { opacity: 0; }
        }
        .header-container {
          background: linear-gradient(135deg, #0a0d14 0%, #131824 50%, #1a140e 100%);
          border: 2px solid #f59e0b;
          border-radius: 14px;
          box-shadow: 0 0 25px rgba(245, 158, 11, 0.25), inset 0 0 20px rgba(217, 119, 6, 0.15);
          width: 796px;
          height: 196px;
          font-family: 'Fira Code', Consolas, 'Courier New', monospace;
          position: relative;
          overflow: hidden;
          box-sizing: border-box;
          color: #e6edf3;
        }
        .grid-bg {
          position: absolute;
          top: 0; left: 0; right: 0; bottom: 0;
          background-image: 
            linear-gradient(to right, rgba(245, 158, 11, 0.05) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(245, 158, 11, 0.05) 1px, transparent 1px);
          background-size: 24px 24px;
        }
        .scanline {
          position: absolute;
          top: 0; left: 0; right: 0;
          height: 25px;
          background: linear-gradient(to bottom, transparent, rgba(245, 158, 11, 0.12), transparent);
          animation: scanline 7s linear infinite;
          pointer-events: none;
        }
        .corner-tl { position: absolute; top: 8px; left: 8px; border-top: 3px solid #f59e0b; border-left: 3px solid #f59e0b; width: 18px; height: 18px; }
        .corner-tr { position: absolute; top: 8px; right: 8px; border-top: 3px solid #fbbf24; border-right: 3px solid #fbbf24; width: 18px; height: 18px; }
        .corner-bl { position: absolute; bottom: 8px; left: 8px; border-bottom: 3px solid #fbbf24; border-left: 3px solid #fbbf24; width: 18px; height: 18px; }
        .corner-br { position: absolute; bottom: 8px; right: 8px; border-bottom: 3px solid #f59e0b; border-right: 3px solid #f59e0b; width: 18px; height: 18px; }
        
        .header-content {
          padding: 26px 36px;
          position: relative;
          z-index: 2;
        }
        .sys-title {
          font-size: 11px;
          letter-spacing: 2.5px;
          color: #fbbf24;
          text-transform: uppercase;
          animation: amberPulse 3s infinite;
          margin-bottom: 10px;
          display: flex;
          align-items: center;
          gap: 8px;
        }
        .sys-dot {
          width: 8px;
          height: 8px;
          background-color: #f59e0b;
          border-radius: 50%;
          display: inline-block;
          animation: blink 1.2s infinite;
          box-shadow: 0 0 8px #f59e0b;
        }
        .main-name {
          font-size: 30px;
          font-weight: 800;
          letter-spacing: 5px;
          background: linear-gradient(90deg, #fbbf24 0%, #ffffff 50%, #f59e0b 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          text-shadow: 0 0 20px rgba(245, 158, 11, 0.35);
          margin: 0;
          text-transform: uppercase;
        }
        .sub-name {
          font-size: 13px;
          color: #d1d5db;
          letter-spacing: 2px;
          margin-top: 6px;
          font-weight: 600;
        }
        .hud-metrics {
          position: absolute;
          bottom: 18px;
          right: 32px;
          display: flex;
          gap: 12px;
          font-size: 10px;
          letter-spacing: 1px;
        }
        .metric-badge {
          background: rgba(245, 158, 11, 0.1);
          border: 1px solid rgba(245, 158, 11, 0.4);
          padding: 5px 12px;
          border-radius: 6px;
          color: #fbbf24;
          font-weight: 600;
        }
        .metric-badge.amber {
          background: rgba(217, 119, 6, 0.15);
          border: 1px solid rgba(245, 158, 11, 0.5);
          color: #f59e0b;
        }
      </style>

      <div class="header-container">
        <div class="grid-bg"></div>
        <div class="scanline"></div>
        <div class="corner-tl"></div>
        <div class="corner-tr"></div>
        <div class="corner-bl"></div>
        <div class="corner-br"></div>

        <div class="header-content">
          <div class="sys-title">
            <span class="sys-dot"></span>
            SYSTEM ONLINE // FULLSTACK DEVELOPER
          </div>
          <h1 class="main-name">GUSTAVO MOREIRA</h1>
          <div class="sub-name">&gt; FULLSTACK DEV &amp; STUDENT | JAVA • PYTHON • NODE.JS • REACT</div>
        </div>

        <div class="hud-metrics">
          <div class="metric-badge">[ STATUS: ACTIVE ]</div>
          <div class="metric-badge amber">[ EN: B2 🌐 ]</div>
          <div class="metric-badge">[ BRASIL 🇧🇷 ]</div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
